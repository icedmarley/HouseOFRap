<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>houseOfRap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   HOUSEOFRAP v2 — NEO-BRUTALIST RAP FORUM
   Palette: #0A0A0A base · #C8FF00 lime · #FF2D55 crimson · #00E5FF cyan
   ═══════════════════════════════════════════════ */
:root {
  --bg:      #0A0A0A;
  --bg2:     #111111;
  --bg3:     #1A1A1A;
  --bg4:     #222222;
  --bg5:     #2A2A2A;
  --border:  #2E2E2E;
  --border2: #3A3A3A;
  --lime:    #C8FF00;
  --lime2:   #A8D900;
  --red:     #FF2D55;
  --cyan:    #00E5FF;
  --orange:  #FF6B00;
  --purple:  #BF5FFF;
  --text:    #F0F0F0;
  --text2:   #999999;
  --text3:   #555555;
  --nav-h:   60px;
  --sidebar-w: 260px;
  --right-w: 280px;
  --font-d:  'Bebas Neue', sans-serif;
  --font-b:  'Outfit', sans-serif;
  --font-m:  'DM Mono', monospace;
  --r:       8px;
  --r2:      4px;
  --glow-lime: 0 0 20px rgba(200,255,0,0.25);
  --glow-red:  0 0 20px rgba(255,45,85,0.3);
  --glow-cyan: 0 0 20px rgba(0,229,255,0.25);
}
[data-theme="light"] {
  --bg:     #F5F5F0;
  --bg2:    #FFFFFF;
  --bg3:    #EFEFEA;
  --bg4:    #E5E5E0;
  --bg5:    #DCDCD7;
  --border: #DCDCD7;
  --border2:#CDCDC8;
  --text:   #111111;
  --text2:  #555555;
  --text3:  #999999;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
/* grain overlay */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size:200px 200px;
  pointer-events:none;
  z-index:9999;
  opacity:.35;
}
a{color:inherit;text-decoration:none}
input,textarea,button,select{font-family:inherit;outline:none}
img{display:block;max-width:100%}
button{cursor:pointer;background:none;border:none}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--lime)}

/* ═══ NAVBAR ═══ */
.navbar{
  position:fixed;top:0;left:0;right:0;
  height:var(--nav-h);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 16px;gap:12px;
  z-index:200;
}
.logo{
  font-family:var(--font-d);
  font-size:28px;
  letter-spacing:1px;
  white-space:nowrap;
  color:var(--text);
  flex-shrink:0;
  display:flex;align-items:center;gap:0;
}
.logo .hor{color:var(--lime)}
.logo-dot{
  width:8px;height:8px;
  background:var(--lime);
  border-radius:50%;
  margin:0 1px 2px;
  display:inline-block;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

.nav-center{flex:1;display:flex;justify-content:center;gap:4px}
.nav-btn{
  height:36px;padding:0 14px;
  border-radius:var(--r);
  color:var(--text2);
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;
  transition:background .15s,color .15s;
  white-space:nowrap;
}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:var(--lime);color:#000}
.nav-btn svg{width:16px;height:16px;fill:currentColor}

.nav-search-wrap{
  position:relative;
  width:260px;flex-shrink:0;
}
.nav-search{
  width:100%;
  height:36px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:0 12px 0 36px;
  color:var(--text);
  font-size:13px;
  transition:border-color .2s,box-shadow .2s;
}
.nav-search:focus{border-color:var(--lime);box-shadow:var(--glow-lime)}
.nav-search::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--text3);pointer-events:none}

/* search results dropdown */
.search-results{
  display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;z-index:300;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
}
.search-results.open{display:block}
.search-result-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  cursor:pointer;
  transition:background .15s;
}
.search-result-item:hover{background:var(--bg3)}
.sri-type{
  font-size:10px;font-weight:700;
  padding:2px 6px;border-radius:3px;
  text-transform:uppercase;font-family:var(--font-m);
  flex-shrink:0;
}
.sri-type.post{background:rgba(200,255,0,.15);color:var(--lime)}
.sri-type.pod{background:rgba(0,229,255,.15);color:var(--cyan)}
.sri-type.concert{background:rgba(255,45,85,.15);color:var(--red)}
.sri-text{font-size:13px;font-weight:500}

.nav-right{display:flex;align-items:center;gap:6px;margin-left:auto}

.icon-btn{
  width:36px;height:36px;
  border-radius:var(--r);
  color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  transition:background .15s,color .15s;
  flex-shrink:0;
}
.icon-btn:hover{background:var(--bg3);color:var(--text)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.notif-badge{
  position:absolute;top:4px;right:4px;
  width:16px;height:16px;
  background:var(--red);color:#fff;
  font-size:9px;font-weight:800;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-m);
}

.avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--lime);color:#000;
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:box-shadow .2s;
}
.avatar:hover{box-shadow:0 0 0 2px var(--lime),var(--glow-lime)}
.avatar.sm{width:30px;height:30px;font-size:11px}
.avatar.xs{width:24px;height:24px;font-size:9px}
.avatar.lg{width:48px;height:48px;font-size:16px}

/* ═══ DROPDOWN PANELS ═══ */
.dropdown{
  display:none;position:fixed;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);z-index:300;
  box-shadow:0 8px 40px rgba(0,0,0,0.7);
  animation:dropIn .15s ease;
}
.dropdown.open{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* notifications */
#notifPanel{top:62px;right:16px;width:340px;max-height:420px;overflow-y:auto}
.notif-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.notif-header h4{font-size:14px;font-weight:700}
.notif-header button{font-size:12px;color:var(--lime);font-weight:600}
.notif-item{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.notif-item:hover{background:var(--bg3)}
.notif-item.unread{background:rgba(200,255,0,0.04)}
.notif-dot{width:8px;height:8px;background:var(--lime);border-radius:50%;margin-top:4px;flex-shrink:0}
.notif-text{flex:1;font-size:12px;color:var(--text2);line-height:1.4}
.notif-text strong{color:var(--text)}
.notif-time{font-size:10px;color:var(--text3);font-family:var(--font-m);flex-shrink:0}

/* user menu */
#userMenu{top:62px;right:16px;width:200px}
.user-menu-header{padding:14px 16px;border-bottom:1px solid var(--border)}
.user-menu-header strong{display:block;font-size:14px}
.user-menu-header small{color:var(--text3);font-size:11px;font-family:var(--font-m)}
.menu-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;font-size:13px;font-weight:500;
  cursor:pointer;transition:background .15s;
}
.menu-item:hover{background:var(--bg3)}
.menu-item svg{width:15px;height:15px;fill:currentColor;color:var(--text2)}
.menu-sep{height:1px;background:var(--border);margin:4px 0}

/* dm panel */
#dmPanel{top:62px;right:56px;width:300px;max-height:420px;overflow-y:auto}

/* ═══ HOT TICKER ═══ */
.hot-ticker{
  position:fixed;top:var(--nav-h);left:0;right:0;
  height:30px;
  background:var(--lime);
  color:#000;
  font-family:var(--font-m);
  font-size:11px;font-weight:500;
  display:flex;align-items:center;
  overflow:hidden;
  z-index:190;
  border-bottom:2px solid #000;
}
.ticker-label{
  background:#000;color:var(--lime);
  padding:0 12px;height:100%;
  display:flex;align-items:center;
  font-weight:700;letter-spacing:1px;
  text-transform:uppercase;flex-shrink:0;
  font-size:10px;
}
.ticker-track{
  display:flex;align-items:center;
  white-space:nowrap;
  animation:ticker 30s linear infinite;
  padding-left:20px;
}
.ticker-track:hover{animation-play-state:paused}
.tick-sep{margin:0 20px;opacity:.5}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ═══ MAIN LAYOUT ═══ */
.layout{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr var(--right-w);
  gap:0;
  max-width:1400px;
  margin:0 auto;
  padding-top:calc(var(--nav-h) + 30px);
  min-height:100vh;
  align-items:start;
}

/* ═══ SIDEBARS ═══ */
.sidebar{
  position:sticky;
  top:calc(var(--nav-h) + 30px);
  height:calc(100vh - var(--nav-h) - 30px);
  overflow-y:auto;
  padding:16px 12px 16px 16px;
  display:flex;flex-direction:column;gap:12px;
}
.sidebar-right{padding:16px 16px 16px 12px}

.scard{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
}
.scard-head{
  padding:12px 14px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.scard-head h3{
  font-family:var(--font-d);
  font-size:16px;letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;
}
.scard-head h3 .hico{font-size:14px}
.see-all{font-size:11px;color:var(--lime);font-weight:700;font-family:var(--font-m)}
.see-all:hover{text-decoration:underline}

/* quick nav */
.qnav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  cursor:pointer;
  transition:background .15s;
  font-size:13px;font-weight:500;
  color:var(--text2);
  border-left:3px solid transparent;
}
.qnav-item:hover{background:var(--bg3);color:var(--text);border-left-color:var(--lime)}
.qnav-item.active{background:rgba(200,255,0,.08);color:var(--lime);border-left-color:var(--lime)}
.qnav-item .qico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.qnav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;font-family:var(--font-m)}

/* concert mini */
.cmini{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.cmini:last-child{border-bottom:none}
.cmini:hover{background:var(--bg3)}
.cmini-date{
  background:var(--lime);color:#000;
  border-radius:6px;min-width:36px;
  padding:3px 4px;text-align:center;flex-shrink:0;
}
.cmini-date .cm{font-size:8px;font-weight:800;text-transform:uppercase;font-family:var(--font-m);display:block}
.cmini-date .cd{font-size:20px;font-weight:900;font-family:var(--font-d);line-height:1;display:block}
.cmini-info{flex:1;min-width:0}
.cmini-title{font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmini-sub{font-size:10px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmini-tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.ctag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--text3);font-family:var(--font-m)}

/* podcast mini */
.pmini{
  display:flex;gap:10px;align-items:center;
  padding:9px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.pmini:last-child{border-bottom:none}
.pmini:hover{background:var(--bg3)}
.pmini-art{
  width:40px;height:40px;border-radius:6px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.pmini-info{flex:1;min-width:0}
.pmini-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmini-by{font-size:10px;color:var(--text3);font-family:var(--font-m)}
.pmini-play{
  width:28px;height:28px;border-radius:50%;
  background:var(--cyan);color:#000;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;flex-shrink:0;
  transition:transform .15s;
}
.pmini:hover .pmini-play{transform:scale(1.1)}

/* tags */
.tag-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.tag-item:last-child{border-bottom:none}
.tag-item:hover{background:var(--bg3)}
.tag-ico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tag-name{font-size:13px;font-weight:700}
.tag-sub{font-size:10px;color:var(--text3);font-family:var(--font-m)}
.tag-trend{margin-left:auto;font-size:9px;font-weight:800;color:var(--lime);text-transform:uppercase;font-family:var(--font-m)}

/* online users */
.online-count{
  display:flex;align-items:center;gap:6px;
  padding:10px 14px;
  font-size:12px;color:var(--text2);
  border-bottom:1px solid var(--border);
}
.online-dot{width:7px;height:7px;background:#00FF88;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px #00FF88;animation:pulse 2s ease-in-out infinite}
.online-num{color:#00FF88;font-weight:800;font-family:var(--font-m)}

/* who to follow */
.follow-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--border);
}
.follow-item:last-child{border-bottom:none}
.follow-info{flex:1;min-width:0}
.follow-info .fn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-info .fs{font-size:10px;color:var(--text3);font-family:var(--font-m)}
.btn-follow{
  background:transparent;
  border:1.5px solid var(--lime);
  color:var(--lime);
  font-size:11px;font-weight:800;
  padding:3px 10px;border-radius:20px;
  transition:background .15s,color .15s;
  font-family:var(--font-m);
  white-space:nowrap;
}
.btn-follow:hover,.btn-follow.following{background:var(--lime);color:#000}

/* ═══ FEED ═══ */
.feed{
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  min-height:calc(100vh - var(--nav-h) - 30px);
}

/* create post */
.create-box{
  padding:16px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.create-row{display:flex;gap:10px;align-items:center}
.create-input{
  flex:1;
  background:var(--bg3);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:10px 14px;
  color:var(--text);
  font-size:13px;
  transition:border-color .2s,box-shadow .2s;
}
.create-input:focus{border-color:var(--lime);box-shadow:var(--glow-lime)}
.create-input::placeholder{color:var(--text3)}
.create-actions{display:flex;gap:6px;margin-top:10px;padding-left:40px}
.create-act-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:var(--r2);
  font-size:11px;font-weight:600;color:var(--text2);
  background:var(--bg3);border:1px solid var(--border);
  transition:background .15s,color .15s;
}
.create-act-btn:hover{background:var(--bg4);color:var(--text)}
.create-act-btn svg{width:13px;height:13px;fill:currentColor}

/* category filter bar */
.cat-bar{
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  overflow-x:auto;
  scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{
  padding:12px 16px;
  font-size:12px;font-weight:700;
  color:var(--text3);
  white-space:nowrap;
  transition:color .15s;
  border-bottom:2px solid transparent;
  flex-shrink:0;
  font-family:var(--font-m);
}
.cat-btn:hover{color:var(--text)}
.cat-btn.active{color:var(--lime);border-bottom-color:var(--lime)}

/* sort bar */
.sort-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  gap:10px;
}
.sort-btns{display:flex;gap:4px}
.sort-btn{
  padding:5px 10px;border-radius:var(--r);
  font-size:11px;font-weight:700;
  color:var(--text3);font-family:var(--font-m);
  transition:background .15s,color .15s;
}
.sort-btn:hover{background:var(--bg3);color:var(--text)}
.sort-btn.active{background:var(--bg3);color:var(--lime)}
.post-count{font-size:11px;color:var(--text3);font-family:var(--font-m)}

/* ═══ POST CARD ═══ */
.post{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .15s;
  position:relative;
  background:var(--bg2);
}
.post:hover{background:var(--bg3)}

/* vote column */
.vote-col{
  display:flex;flex-direction:column;align-items:center;
  padding:14px 10px;
  gap:4px;
  border-right:1px solid var(--border);
  min-width:54px;
  flex-shrink:0;
}
.vote-btn{
  width:28px;height:28px;border-radius:var(--r2);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--text3);
  transition:background .15s,color .15s,transform .1s;
}
.vote-btn:hover{transform:scale(1.15)}
.vote-btn.up:hover,.vote-btn.up.active{color:var(--lime);background:rgba(200,255,0,.12)}
.vote-btn.down:hover,.vote-btn.down.active{color:var(--red);background:rgba(255,45,85,.12)}
.vote-count{font-size:13px;font-weight:800;color:var(--text);font-family:var(--font-m)}
.vote-count.hot{color:var(--lime)}

/* post thumb */
.post-thumb{
  width:120px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;
  background:var(--bg3);
  position:relative;overflow:hidden;
  border-right:1px solid var(--border);
}
.post-thumb .emoji-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.9}
.post-flair{
  position:absolute;top:8px;left:0;
  font-size:9px;font-weight:800;
  padding:3px 7px;
  font-family:var(--font-m);
  text-transform:uppercase;
  border-radius:0 3px 3px 0;
}

.post-body{flex:1;padding:14px 14px 12px;min-width:0}
.post-meta-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.post-cat-tag{
  font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:3px;
  font-family:var(--font-m);text-transform:uppercase;
}
.post-author-meta{font-size:11px;color:var(--text3);font-family:var(--font-m)}
.post-author-meta strong{color:var(--text2);font-weight:600}
.post-title{
  font-family:var(--font-d);
  font-size:18px;letter-spacing:.3px;
  line-height:1.2;margin-bottom:8px;
  transition:color .15s;
}
.post:hover .post-title{color:var(--lime)}
.post-tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ptag{
  font-size:10px;padding:2px 8px;border-radius:3px;
  background:var(--bg4);color:var(--text3);
  font-family:var(--font-m);font-weight:500;
  transition:background .15s,color .15s;
}
.ptag:hover{background:rgba(200,255,0,.12);color:var(--lime)}
.post-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pf-stat{
  display:flex;align-items:center;gap:4px;
  font-size:11px;color:var(--text3);
  font-family:var(--font-m);
  transition:color .15s;
}
.pf-stat svg{width:13px;height:13px;fill:currentColor}
.pf-stat:hover{color:var(--lime)}
.pf-btns{display:flex;align-items:center;gap:4px;margin-left:auto}
.pf-btn{
  display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:var(--r2);
  font-size:11px;font-weight:600;color:var(--text3);
  transition:background .15s,color .15s;
  font-family:var(--font-m);
}
.pf-btn:hover{background:var(--bg4);color:var(--text)}
.pf-btn svg{width:12px;height:12px;fill:currentColor}
.pf-btn.saved,.pf-btn.saved:hover{color:var(--lime)}

/* pinned post */
.post.pinned{border-left:3px solid var(--lime)}
.pin-badge{
  font-size:9px;font-weight:800;color:var(--lime);
  background:rgba(200,255,0,.1);
  padding:2px 6px;border-radius:3px;
  font-family:var(--font-m);text-transform:uppercase;
}

/* ═══ BUTTONS ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 20px;border-radius:var(--r);
  font-size:13px;font-weight:700;
  transition:opacity .15s,transform .1s,box-shadow .15s;
  white-space:nowrap;
  border:none;cursor:pointer;
}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-lime{background:var(--lime);color:#000}
.btn-lime:hover{box-shadow:var(--glow-lime)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{box-shadow:var(--glow-red)}
.btn-cyan{background:var(--cyan);color:#000}
.btn-cyan:hover{box-shadow:var(--glow-cyan)}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn svg{width:14px;height:14px;fill:currentColor}

/* ═══ MODAL ═══ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);z-index:500;
  align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:10px;padding:0;
  width:calc(100% - 32px);max-width:580px;
  max-height:90vh;overflow-y:auto;
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.modal-header h3{font-family:var(--font-d);font-size:20px;letter-spacing:.5px}
.modal-close{
  width:30px;height:30px;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);background:var(--bg3);font-size:16px;
  transition:background .15s,color .15s;
}
.modal-close:hover{background:var(--bg4);color:var(--text)}
.modal-body{padding:20px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;font-family:var(--font-m);text-transform:uppercase}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg3);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:10px 14px;color:var(--text);
  font-size:13px;font-family:var(--font-b);
  transition:border-color .2s,box-shadow .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--lime);box-shadow:var(--glow-lime)}
.form-textarea{resize:vertical;min-height:100px}
.form-select option{background:var(--bg3)}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* category color pills */
.cat-review    {background:rgba(200,255,0,.15);color:var(--lime)}
.cat-news      {background:rgba(0,229,255,.15);color:var(--cyan)}
.cat-discussion{background:rgba(255,107,0,.15);color:var(--orange)}
.cat-concert   {background:rgba(255,45,85,.15);color:var(--red)}
.cat-podcast   {background:rgba(191,95,255,.15);color:var(--purple)}
.cat-beef      {background:rgba(255,45,85,.2);color:var(--red)}

/* ═══ POST DETAIL VIEW ═══ */
#view-post{display:none}
.post-detail-wrap{padding:20px;max-width:800px;margin:0 auto}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:700;color:var(--lime);
  margin-bottom:16px;cursor:pointer;
  transition:opacity .15s;
}
.back-btn:hover{opacity:.7}
.back-btn svg{width:16px;height:16px;fill:currentColor}
.post-detail-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
}
.post-detail-banner{
  height:220px;
  display:flex;align-items:center;justify-content:center;
  font-size:80px;position:relative;
}
.post-detail-content{padding:24px}
.post-detail-content h1{
  font-family:var(--font-d);font-size:32px;
  letter-spacing:.5px;line-height:1.15;
  margin-bottom:14px;
}
.post-detail-body{
  color:var(--text2);font-size:14px;line-height:1.7;
  margin-bottom:20px;
}
.post-detail-body p{margin-bottom:12px}
.post-detail-body strong{color:var(--text)}
.detail-actions{
  display:flex;align-items:center;gap:8px;
  padding:16px 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  margin-bottom:20px;
}

/* comments section */
.comments-section{margin-top:24px}
.comments-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.comments-header h3{font-family:var(--font-d);font-size:20px;letter-spacing:.5px}
.comment-sort{display:flex;gap:4px}
.csort-btn{
  padding:4px 10px;border-radius:var(--r);
  font-size:11px;font-weight:700;color:var(--text3);
  font-family:var(--font-m);transition:background .15s,color .15s;
}
.csort-btn.active{background:var(--bg3);color:var(--lime)}
.csort-btn:hover{color:var(--text)}

.comment-input-area{
  display:flex;gap:10px;margin-bottom:20px;
  background:var(--bg3);border:1.5px solid var(--border);
  border-radius:var(--r);padding:12px;
  transition:border-color .2s;
}
.comment-input-area:focus-within{border-color:var(--lime)}
.comment-input-area textarea{
  flex:1;background:none;border:none;color:var(--text);
  font-size:13px;resize:none;min-height:60px;line-height:1.5;
}
.comment-input-area textarea::placeholder{color:var(--text3)}
.comment-submit-col{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:6px}

.comment-card{
  display:flex;gap:10px;margin-bottom:14px;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.comment-body{flex:1;background:var(--bg3);border-radius:var(--r);padding:12px;border:1px solid var(--border)}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.comment-name{font-size:13px;font-weight:700}
.comment-verified{color:var(--lime);font-size:10px}
.comment-time{font-size:10px;color:var(--text3);font-family:var(--font-m);margin-left:auto}
.comment-text{font-size:13px;color:var(--text2);line-height:1.5}
.comment-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
.ca-btn{
  display:flex;align-items:center;gap:4px;
  font-size:11px;color:var(--text3);font-family:var(--font-m);font-weight:600;
  transition:color .15s;
}
.ca-btn:hover{color:var(--lime)}
.ca-btn.liked{color:var(--lime)}
.ca-btn svg{width:12px;height:12px;fill:currentColor}

/* replies */
.replies{margin-top:10px;padding-left:16px;border-left:2px solid var(--border)}
.reply-card{
  display:flex;gap:8px;margin-top:10px;
  animation:fadeIn .3s ease;
}
.reply-body{flex:1;background:var(--bg4);border-radius:var(--r);padding:10px;border:1px solid var(--border)}
.reply-input-area{
  display:flex;gap:8px;align-items:flex-end;
  margin-top:10px;padding:8px;
  background:var(--bg4);border-radius:var(--r);border:1px solid var(--border);
}
.reply-input-area input{
  flex:1;background:none;border:none;
  color:var(--text);font-size:12px;padding:2px 0;
}
.reply-input-area input::placeholder{color:var(--text3)}

/* ═══ CONCERTS VIEW ═══ */
#view-concerts{display:none}
.concerts-wrap{padding:20px}
.concerts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
  margin-top:14px;
}
.concert-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;
}
.concert-card:hover{border-color:var(--lime);transform:translateY(-3px);box-shadow:0 8px 24px rgba(200,255,0,.1)}
.cc-head{
  padding:16px;background:var(--bg3);
  display:flex;gap:14px;align-items:center;
  border-bottom:1px solid var(--border);
}
.cc-date{
  background:var(--lime);color:#000;
  border-radius:6px;padding:6px 8px;text-align:center;
  flex-shrink:0;min-width:48px;
}
.cc-date .ccm{font-size:9px;font-weight:900;text-transform:uppercase;font-family:var(--font-m);display:block;letter-spacing:1px}
.cc-date .ccd{font-size:28px;font-weight:900;font-family:var(--font-d);line-height:1;display:block}
.cc-meta h3{font-family:var(--font-d);font-size:16px;letter-spacing:.3px;line-height:1.2;margin-bottom:2px}
.cc-meta .cc-loc{font-size:11px;color:var(--text2);margin-bottom:3px}
.cc-meta .cc-artists{font-size:11px;color:var(--cyan);font-weight:700;font-family:var(--font-m)}
.cc-body{padding:12px 16px}
.cc-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.cc-pill-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.cc-pill{
  font-size:9px;padding:2px 8px;border-radius:3px;
  background:var(--bg4);color:var(--text3);
  font-family:var(--font-m);text-transform:uppercase;font-weight:700;
}
.cc-rsvp{
  display:flex;align-items:center;gap:6px;
}
.rsvp-count{font-size:11px;color:var(--text3);font-family:var(--font-m)}

/* ═══ PODCASTS VIEW ═══ */
#view-podcasts{display:none}
.podcasts-wrap{padding:20px}
.podcasts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
  margin-top:14px;
}
.podcast-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  cursor:pointer;transition:border-color .2s,transform .15s;
}
.podcast-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.pc-art{
  height:120px;
  display:flex;align-items:center;justify-content:center;
  font-size:48px;position:relative;
}
.pc-art::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg2),transparent 60%);
}
.pc-body{padding:14px}
.pc-body h3{font-family:var(--font-d);font-size:17px;letter-spacing:.3px;margin-bottom:3px;line-height:1.2}
.pc-by{font-size:11px;color:var(--text3);font-family:var(--font-m);margin-bottom:8px}
.pc-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.pc-stats{display:flex;gap:14px;font-size:10px;color:var(--text3);font-family:var(--font-m);margin-bottom:10px}

/* ═══ PLAYER BAR ═══ */
.player-bar{
  position:fixed;bottom:-80px;left:0;right:0;
  height:68px;background:var(--bg2);
  border-top:2px solid var(--lime);
  display:flex;align-items:center;
  padding:0 20px;gap:16px;
  z-index:200;
  transition:bottom .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -8px 32px rgba(0,0,0,.6);
}
.player-bar.visible{bottom:0}
.player-art{
  width:44px;height:44px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.player-info{flex:0 0 200px}
.player-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-by{font-size:11px;color:var(--text3);font-family:var(--font-m)}
.player-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pctrl{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);
  transition:background .15s,color .15s;
}
.pctrl:hover{background:var(--bg3);color:var(--text)}
.pctrl.play{
  background:var(--lime);color:#000;
  width:38px;height:38px;font-size:16px;
  transition:box-shadow .15s;
}
.pctrl.play:hover{box-shadow:var(--glow-lime)}
.player-progress{flex:1;display:flex;flex-direction:column;gap:4px;max-width:400px}
.prog-bar{
  height:4px;background:var(--bg4);border-radius:2px;
  cursor:pointer;position:relative;
}
.prog-fill{
  height:100%;background:var(--lime);border-radius:2px;
  width:0%;transition:width .1s;
}
.prog-times{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);font-family:var(--font-m)}
.player-vol{display:flex;align-items:center;gap:8px;flex-shrink:0}
.vol-icon{font-size:14px;color:var(--text2)}
.vol-slider{
  width:70px;height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--bg4);border-radius:2px;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:12px;height:12px;border-radius:50%;
  background:var(--lime);cursor:pointer;
}
.player-close{color:var(--text3);font-size:14px;padding:4px}
.player-close:hover{color:var(--red)}

/* ═══ TOASTS ═══ */
.toast-container{position:fixed;bottom:80px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:10px 14px;
  font-size:13px;font-weight:600;
  box-shadow:0 4px 24px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:8px;
  pointer-events:all;max-width:280px;
  animation:toastIn .25s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast.success .toast-ico{color:var(--lime)}
.toast.error .toast-ico{color:var(--red)}
.toast.info .toast-ico{color:var(--cyan)}
.toast-ico{font-size:16px}
.toast-text{flex:1}

/* ═══ THEME TOGGLE ═══ */
.theme-toggle{
  width:36px;height:20px;border-radius:10px;
  background:var(--bg4);border:1px solid var(--border2);
  position:relative;cursor:pointer;transition:background .2s;
  flex-shrink:0;
}
.theme-toggle.on{background:var(--lime)}
.toggle-knob{
  width:14px;height:14px;border-radius:50%;
  background:#000;position:absolute;
  top:2px;left:2px;
  transition:transform .2s;
}
.theme-toggle.on .toggle-knob{transform:translateX(16px)}

/* ═══ PAGE HEADERS ═══ */
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.page-header h2{font-family:var(--font-d);font-size:28px;letter-spacing:1px}
.month-label{
  font-family:var(--font-d);font-size:22px;letter-spacing:1px;
  color:var(--lime);margin:20px 0 10px;
  display:flex;align-items:center;gap:12px;
}
.month-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══ PROFILE VIEW ═══ */
#view-profile{display:none}
.profile-wrap{max-width:700px;margin:0 auto;padding:20px}
.profile-banner{height:140px;background:linear-gradient(135deg,#0A0A0A 0%,#1A1A00 50%,#0A0A0A 100%);border-radius:var(--r) var(--r) 0 0;position:relative}
.profile-header{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:0 0 var(--r) var(--r);
  padding:0 20px 20px;
  margin-bottom:14px;
}
.profile-avatar-wrap{margin-top:-28px;margin-bottom:12px;position:relative;display:inline-block}
.profile-avatar{
  width:60px;height:60px;border-radius:50%;
  background:var(--lime);color:#000;
  font-size:22px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  border:3px solid var(--bg2);
}
.profile-name{font-family:var(--font-d);font-size:24px;letter-spacing:.5px}
.profile-handle{font-size:12px;color:var(--text3);font-family:var(--font-m);margin-bottom:8px}
.profile-bio{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.profile-stats{display:flex;gap:20px;flex-wrap:wrap}
.pstat{text-align:center}
.pstat .num{font-size:18px;font-weight:800;font-family:var(--font-d);color:var(--lime)}
.pstat .lab{font-size:10px;color:var(--text3);font-family:var(--font-m)}

/* ═══ EMPTY STATE ═══ */
.empty-state{
  padding:48px 20px;text-align:center;
  color:var(--text3);
}
.empty-state .es-ico{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state h3{font-family:var(--font-d);font-size:22px;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px}

/* ═══ SAVED VIEW ═══ */
#view-saved{display:none}

/* ═══ DIVIDER ═══ */
.divider{height:1px;background:var(--border);margin:16px 0}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1100px){
  .layout{grid-template-columns:var(--sidebar-w) 1fr}
  .sidebar-right{display:none}
}
@media(max-width:720px){
  .layout{grid-template-columns:1fr}
  .sidebar-left{display:none}
  :root{--sidebar-w:0px}
  .post-thumb{width:80px}
  .vote-col{min-width:42px;padding:10px 6px}
  .nav-search-wrap{display:none}
}
</style>
</head>

function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toString()}

function catClass(cat){return'cat-'+cat}
function catLabel(cat){const m={news:'NEWS',review:'REVIEW',discussion:'DISCUSSION',beef:'BEEF',concert:'CONCERT',podcast:'PODCAST'};return m[cat]||cat.toUpperCase()}
function catColor(cat){const m={news:'var(--cyan)',review:'var(--lime)',discussion:'var(--orange)',beef:'var(--red)',concert:'var(--red)',podcast:'var(--purple)'};return m[cat]||'var(--text3)'}

  document.getElementById('sortBtns').innerHTML = sorts.map(s=>

function getFilteredPosts(){
  let posts = [...POSTS];
  if(STATE.category!=='all') posts = posts.filter(p=>p.cat===STATE.category);
  if(STATE.sort==='hot') posts.sort((a,b)=>b.votes-a.votes);
  else if(STATE.sort==='new') posts.sort((a,b)=>b.id-a.id);
  else if(STATE.sort==='top') posts.sort((a,b)=>(b.likes+b.votes)-(a.likes+a.votes));
  else posts.sort((a,b)=>(b.comments/b.votes)-(a.comments/a.votes));
  // pinned first
  posts.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return posts;
}

  return comments.map(c=>renderComment(c,postId)).join('');
}

  const likes = c.likes+(liked?1:0);
  return `

      <div class="avatar xs" style="background:${c.avbg};color:${c.avfg}">${c.author.slice(0,2).toUpperCase()}</div>

function vote(e,id,dir){
  e.stopPropagation();
  const prev = STATE.votedPosts[id]||0;
  if(prev===dir) STATE.votedPosts[id]=0;
  else STATE.votedPosts[id]=dir;
  renderPosts();
  toast(STATE.votedPosts[id]===dir?(dir>0?'Upvoted! 🔥':'Downvoted'):'Vote removed','info');
}

function toggleSave(id,btn){
  if(STATE.savedPosts.has(id)){
    STATE.savedPosts.delete(id);
    if(btn){btn.textContent='Save';btn.classList.remove('saved')}
    toast('Post removed from saved','info');
  } else {
    STATE.savedPosts.add(id);
    if(btn){btn.textContent='Saved';btn.classList.add('saved')}
    toast('Post saved! 🔖','success');
  }
  renderSidebars();
}

function postComment(postId){

    text,time:'just now',likes:0,replies:[]
  };

function onSearch(q){
  const r=document.getElementById('searchResults');
  q=q.trim();
  if(!q){r.classList.remove('open');return}
  const results=[];
  POSTS.filter(p=>p.title.toLowerCase().includes(q.toLowerCase())||p.tags.join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,3).forEach(p=>{
    results.push(`<div class="search-result-item" onclick="openPost(${p.id});closeSearch()"><span class="sri-type post">POST</span><span class="sri-text">${p.title.slice(0,50)}...</span></div>`);
  });
  CONCERTS.filter(c=>c.title.toLowerCase().includes(q.toLowerCase())||c.artists.toLowerCase().includes(q.toLowerCase())).slice(0,2).forEach(c=>{
    results.push(`<div class="search-result-item" onclick="showView('concerts');closeSearch()"><span class="sri-type concert">CONCERT</span><span class="sri-text">${c.title}</span></div>`);
  });
  PODCASTS.filter(p=>p.title.toLowerCase().includes(q.toLowerCase())).slice(0,2).forEach(p=>{
    results.push(`<div class="search-result-item" onclick="playPodcast('${p.id}');closeSearch()"><span class="sri-type pod">PODCAST</span><span class="sri-text">${p.title}</span></div>`);
  });
  if(!results.length) results.push(`<div class="search-result-item"><span style="color:var(--text3);font-size:12px">No results for "${q}"</span></div>`);
  r.innerHTML=results.join('');
  r.classList.add('open');
}
function closeSearch(){
  document.getElementById('searchResults').classList.remove('open');
  document.getElementById('searchInput').value='';
}

══════════════════════════════════════ */
function playPodcast(id){
  const p=PODCASTS.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('playerArt').textContent=p.emoji;
  document.getElementById('playerArt').style.background=p.bg;
  document.getElementById('playerTitle').textContent=p.title;
  document.getElementById('playerBy').textContent=p.by;
  document.getElementById('playerBar').classList.add('visible');
  document.getElementById('timeR').textContent=p.dur;
  STATE.playerProgress=0;
  STATE.playerPlaying=true;
  document.getElementById('playBtn').textContent='⏸';
  startPlayerInterval();
  toast(`Now playing: ${p.title.slice(0,30)}... 🎙`,'info');
}
function startPlayerInterval(){
  clearInterval(STATE.playerInterval);
  STATE.playerInterval=setInterval(()=>{
    if(!STATE.playerPlaying) return;
    STATE.playerProgress=Math.min(STATE.playerProgress+0.008,100);
    document.getElementById('progFill').style.width=STATE.playerProgress+'%';
    const s=Math.floor(STATE.playerProgress*STATE.playerDuration/100);
    document.getElementById('timeL').textContent=fmtTime(s);
  },100);
}
function fmtTime(s){return Math.floor(s/3600)+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60)}
function pad(n){return n<10?'0'+n:String(n)}
function togglePlay(){
  STATE.playerPlaying=!STATE.playerPlaying;
  document.getElementById('playBtn').textContent=STATE.playerPlaying?'⏸':'▶';
}
function seekBack(){STATE.playerProgress=Math.max(0,STATE.playerProgress-3);document.getElementById('progFill').style.width=STATE.playerProgress+'%'}
function seekFwd(){STATE.playerProgress=Math.min(100,STATE.playerProgress+3);document.getElementById('progFill').style.width=STATE.playerProgress+'%'}
function seekTo(e){
  const bar=e.currentTarget;
  const pct=(e.clientX-bar.getBoundingClientRect().left)/bar.offsetWidth*100;
  STATE.playerProgress=Math.max(0,Math.min(100,pct));
  document.getElementById('progFill').style.width=STATE.playerProgress+'%';
}
function setVol(v){/* volume UI only */}
function closePlayer(){
  document.getElementById('playerBar').classList.remove('visible');
  STATE.playerPlaying=false;clearInterval(STATE.playerInterval);
}

function toast(msg,type='info'){
  const icons={success:'✅',error:'❌',info:'💡'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span class="toast-ico">${icons[type]||'💡'}</span><span class="toast-text">${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>el.style.opacity='0',2500);
  setTimeout(()=>el.remove(),2800);
}
